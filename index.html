<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162d27"><link rel="manifest" href="manifest.json"><title>Treino & Nutrição</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f2;color:#162d27;font:16px system-ui}header{background:#162d27;color:white;padding:24px}header h1{margin:0;font-size:26px}main{max-width:720px;margin:auto;padding:16px 16px 100px}section{background:white;border:1px solid #dce5df;border-radius:18px;padding:18px;margin:12px 0}h2,h3{margin:0 0 12px}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;padding:10px 4px max(10px,env(safe-area-inset-bottom));gap:4px;box-shadow:0 -4px 20px #0001}button,select,input{font:inherit;padding:12px;border:1px solid #ccd9d0;border-radius:12px;color:inherit;background:white}nav button{flex:1;max-width:180px;padding:12px 4px;font-size:14px}.active,.primary{background:#21664d;color:white}select,input:not([type=checkbox]){width:100%;margin:5px 0}label{display:flex;gap:12px;align-items:center}input[type=checkbox]{width:22px;height:22px;accent-color:#21664d}small{opacity:.75}p{line-height:1.5}@media(prefers-color-scheme:dark){body{background:#101a15;color:#e5eee8}section,nav,button,select,input{background:#202d26;color:#e5eee8;border-color:#35453b}.active,.primary{background:#21664d}}</style><header><small>FITNESS · PLANO PESSOAL</small><h1>Treino & Nutrição</h1></header><main id="main"></main><nav id="nav"></nav><script>const D={"Janeiro":[["Peito e ombros","4×20-12-10-8 flexões + 10 aberturas em pé","4×20-12-10-8 chest press + 10 aberturas","4×20-12-10-8 Arnold press + 10 abduções","4×20-12-10-8 press ombros + 10 elevações frontais"],["Costas e braços","3×12-10-8 remada unilateral em prancha + 12 voos","3×12-10-8 remada baixa + 10 remadas cotovelos altos","3×20-12-10 tríceps supinado + 12 curl","3×20-12-10 tríceps testa + 12 martelo"],["Pernas e braços","4×20-12-10-8 agachamento + 10 saltos","4×20-12-10-8 lunge alternado + 12 lunge salto","4×20-12-10-8 peso morto + 10 sumô","4×20-15-12-10 tríceps supinado + curl + 12 abduções"]],"Fevereiro":[["Pernas e ombros","3×12 agachamento clean and press + Arnold press + 10 saltos","3×12 agachamento abdução + press ombros + 10 saltos","3×12 sumô + abdução + 10 saltos","3×12 lunge press + elevação frontal + 10 saltos"],["Peito e tríceps","3×12 flexões pés na cadeira + 12 francês + 20 jumping jacks lateral","3×12 aberturas em pé + 12 supinado + 20 jumping jacks lateral","3×12 press plano + 12 flexão tríceps + 20 jumping jacks lateral"],["Costas e bíceps","3×12 remada unilateral + 12 curl + 20 jumping jacks frontal","3×12 peso morto + 12 martelo + 20 jumping jacks frontal","3×12 remada em prancha + 12 concentrado + 20 jumping jacks frontal"]],"Março":[["Peito e costas","3×12 aberturas planas + chest press plano + remada baixa","3×12 abertura declinada + chest press declinado + remada cotovelos altos","3×12 chest press miolo + flexão salto + remada em prancha","3×12 aberturas em pé + flexões cadeira + voos"],["Pernas e bíceps","3×12 agachamento + lunge trás + curl","3×12 sumô + lunge frente + martelo","3×12 peso morto + agachamento pernas juntas + concentrado","3×12 agachamento salto + lunge salto + martelo unilateral"],["Ombros e tríceps","3×12 abdução + press + francês","3×12 elevação + Arnold + testa","3×12 remada frontal + press unilateral + kickback","3×12 pike + burpee + flexão tríceps"]]},N={"Janeiro":["3 claras + 2 gemas; 2 fatias pão ou 20 g aveia + banana; chocolate negro","Skyr ou pudim proteico ou atum; banana; queijo fresco magro","150 g carne/peixe ou proteína vegetal; 100 g hidratos; 100 g legumes; salada","3 tostas arroz ou 2 fatias pão; skyr ou ovos ou atum; fruta","150 g carne/peixe ou proteína vegetal; 50 g hidratos; 100 g legumes; salada","Opcional: gelatina e fruta"],"Fevereiro":["200 g claras + ovo + vegetais; 30 g aveia + 30 g frutos vermelhos","150 g carne branca/peixe + 100 g hidratos + salada + 150 g legumes","Atum ou whey + pão ou banana; alternativa: claras, ovo, espinafres, aveia e frutos vermelhos","150 g carne branca/peixe + 50 g hidratos + salada + 150 g legumes; azeite ou abacate","2 ovos + gelatina"],"Março HIGH":["50 g aveia + canela + meia banana + frutos vermelhos; 2 ovos","75 g alimento proteico + 150 g hidratos + 125 g legumes; gelatina","Fruta + 2 fatias pão + ovo","Iogurte proteico ou atum + 2 tostas arroz + 20 g manteiga amendoim + 50 g frutos vermelhos ou ananás","75 g alimento proteico + 150 g hidratos + 125 g legumes; frutos vermelhos","2 tostas arroz + ovo"],"Março LOW":["150 ml claras + ovo + pimentos, espinafres e cogumelos","200 g alimento proteico + 50 g hidratos + 150 g legumes; gelatina","Fruta + 20 g frutos secos + 2 ovos","Iogurte proteico ou atum + queijo ou chocolate negro","200 g alimento proteico + 200 g legumes; frutos vermelhos","2 ovos ou iogurte proteico"]};let s;try{s=JSON.parse(localStorage.treino2)||{}}catch{s={}};s.m??='Janeiro';s.d??=0;s.n??='Janeiro';s.log??={};s.weight??={};let tab='Hoje';const $=x=>document.getElementById(x),day=()=>new Date().toLocaleDateString('sv-SE'),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.treino2=JSON.stringify(s);function go(t){tab=t;render()}function set(k,v){s[k]=v;save();render()}function record(k,v){s.log[k]=v;save()}function opts(o,v){return Object.keys(o).map(k=>'<option '+(k===v?'selected':'')+'>'+k+'</option>').join('')}function card(t,i){let k=day()+'|'+s.m+'|'+s.d+'|'+i;return '<section><small>Bloco '+(i+1)+'</small><h3>'+esc(t)+'</h3><label><input type="checkbox" '+(s.log[k]?'checked':'')+' onchange="record(\''+k+'\',this.checked)">Concluído</label><input placeholder="Carga / repetições / notas" value="'+esc(s.log[k+'n']||'')+'" onchange="record(\''+k+'n\',this.value)"></section>'}function render(){let w=D[s.m][s.d];$('nav').innerHTML=['Hoje','Treino','Nutrição','Progresso'].map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="go(\''+t+'\')">'+t+'</button>').join('');$('main').innerHTML=tab==='Hoje'?'<section><small>'+day()+'</small><h2>'+w[0]+'</h2><p>'+s.m+' · Treino '+(s.d+1)+'</p><button class="primary" onclick="go(\'Treino\')">Começar treino</button></section><section><h2>Nutrição</h2><p>'+s.n+'</p><button onclick="go(\'Nutrição\')">Ver refeições</button></section><small>Escolhe o treino manualmente. Planos de referência, não personalizados.</small>':tab==='Treino'?'<section><h2>Plano de treino</h2><select onchange="set(\'m\',this.value)">'+opts(D,s.m)+'</select><select onchange="set(\'d\',+this.value)">'+D[s.m].map((x,i)=>'<option value="'+i+'" '+(i===s.d?'selected':'')+'>'+x[0]+'</option>').join('')+'</select><p>Descanso: 30 segundos após cada circuito.</p></section>'+card(s.m==='Janeiro'?'2×20 jumping jacks + 20 skipping alto':s.m==='Fevereiro'?'3×20 s flexões + agachamento salto + abdominal mola':'3×20 s lunge salto + burpee + mountain climbers',0)+w.slice(1).map((x,i)=>card(x,i+1)).join('')+card(s.m==='Janeiro'?'3×20 s crunch + lateral 20 s cada lado + prancha toque ombros 10 por lado':s.m==='Fevereiro'?'Abdominais 3×20 s — sequência visual pendente':'Abdominais 3×20 s superior, lateral e inferior (2 de cada)',8)+card(s.m==='Janeiro'?'15 min corrida, bicicleta ou corda':s.m==='Fevereiro'?'30 min corrida no fim':'40 min cardio',9):tab==='Nutrição'?'<section><h2>Plano alimentar</h2><select onchange="set(\'n\',this.value)">'+opts(N,s.n)+'</select><small>Quantidades de referência; peso cru/cozinhado não especificado.</small></section>'+N[s.n].map((x,i)=>'<section><h3>'+((s.n==='Janeiro'?['Pequeno-almoço','Lanche manhã','Almoço','Lanche tarde','Jantar','Ceia']:s.n==='Fevereiro'?['Lanche manhã','Almoço','Lanche tarde','Jantar','Ceia']:['Lanche manhã','Almoço','Lanche tarde 1','Lanche tarde 2','Jantar','Ceia'])[i])+'</h3><p>'+esc(x)+'</p></section>').join(''):'<section><h2>Peso corporal</h2><input id="kg" type="number" step=".1" placeholder="kg"><button onclick="if(+$(\'kg\').value>0){s.weight[day()]=+$(\'kg\').value;save();render()}">Guardar</button>'+Object.entries(s.weight).map(([k,v])=>'<p>'+esc(k)+' · '+esc(v)+' kg</p>').join('')+'</section><section><h2>Histórico</h2><p>'+Object.values(s.log).filter(v=>v===true).length+' blocos concluídos</p>'+Object.entries(s.log).filter(([k,v])=>k.endsWith('n')&&v).map(([k,v])=>'<p>'+esc(k)+' · '+esc(v)+'</p>').join('')+'</section>'}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></html>
