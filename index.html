<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162d27"><link rel="manifest" href="manifest.json"><title>Treino & Nutrição</title><style>*{box-sizing:border-box} :root{color-scheme:light;--bg:#f6f7f9;--surface:#fff;--text:#17232a;--muted:#75818a;--line:#e7ebee;--accent:#237b60;--soft:#e8f5ef}html[data-theme=dark]{color-scheme:dark;--bg:#101614;--surface:#1b2521;--text:#edf5ef;--muted:#a0b0a7;--line:#34423b;--accent:#62c49b;--soft:#263e34}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}header{background:var(--surface);padding:24px 20px 20px;border-bottom:1px solid var(--line)}header h1{margin:4px 0 0;font-size:28px;letter-spacing:-1.1px}header small{color:var(--accent);font-weight:750;letter-spacing:1.6px;font-size:11px}main{max-width:760px;margin:auto;padding:16px 16px 110px}section{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 3px 14px #00000005}h2,h3{margin:0 0 12px;letter-spacing:-.4px}h2{font-size:23px}h3{font-size:18px}nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);display:flex;justify-content:center;padding:8px 4px max(10px,env(safe-area-inset-bottom));gap:2px;border-top:1px solid var(--line);box-shadow:0 -4px 24px #00000008}button,select,input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--text);background:var(--surface)}button{cursor:pointer;font-weight:650}nav button{flex:1;max-width:160px;padding:7px 2px;font-size:11px;border:0;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:4px}nav button svg{width:23px;height:23px}nav button.active{color:var(--accent);background:var(--soft)}.primary{background:var(--accent);color:white;border:0}select,input:not([type=checkbox]){width:100%;margin:7px 0;background:var(--bg)}label{display:flex;gap:12px;align-items:center}input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}small{color:var(--muted)}p{line-height:1.55;margin:10px 0}.weekcard{position:relative;padding-left:72px}.dayicon{position:absolute;left:18px;top:20px;width:40px;height:40px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center}.dayicon svg{width:23px;height:23px}.weekcard.rest{opacity:.82}.weekcard p{font-size:14px;color:var(--muted)}.weekcard button{width:100%;margin-top:8px}.hero{background:var(--soft);border:0}.stats{display:flex;gap:12px;margin:12px 0}.stat{flex:1;background:var(--surface);border-radius:16px;padding:14px}.stat b{display:block;font-size:26px;color:var(--accent)}.settingrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.settingrow button{min-width:100px}.themeon{background:var(--soft);color:var(--accent)}</style><header><small>KHAUZLABS / FITNESS</small><h1>Treino & Nutrição</h1></header><main id="main"></main><nav id="nav"></nav><script>const D={"Janeiro":[["Peito e ombros","4×20-12-10-8 flexões + 10 aberturas em pé","4×20-12-10-8 chest press + 10 aberturas","4×20-12-10-8 Arnold press + 10 abduções","4×20-12-10-8 press ombros + 10 elevações frontais"],["Costas e braços","3×12-10-8 remada unilateral em prancha + 12 voos","3×12-10-8 remada baixa + 10 remadas cotovelos altos","3×20-12-10 tríceps supinado + 12 curl","3×20-12-10 tríceps testa + 12 martelo"],["Pernas e braços","4×20-12-10-8 agachamento + 10 saltos","4×20-12-10-8 lunge alternado + 12 lunge salto","4×20-12-10-8 peso morto + 10 sumô","4×20-15-12-10 tríceps supinado + curl + 12 abduções"]],"Fevereiro":[["Pernas e ombros","3×12 agachamento clean and press + Arnold press + 10 saltos","3×12 agachamento abdução + press ombros + 10 saltos","3×12 sumô + abdução + 10 saltos","3×12 lunge press + elevação frontal + 10 saltos"],["Peito e tríceps","3×12 flexões pés na cadeira + 12 francês + 20 jumping jacks lateral","3×12 aberturas em pé + 12 supinado + 20 jumping jacks lateral","3×12 press plano + 12 flexão tríceps + 20 jumping jacks lateral"],["Costas e bíceps","3×12 remada unilateral + 12 curl + 20 jumping jacks frontal","3×12 peso morto + 12 martelo + 20 jumping jacks frontal","3×12 remada em prancha + 12 concentrado + 20 jumping jacks frontal"]],"Março":[["Peito e costas","3×12 aberturas planas + chest press plano + remada baixa","3×12 abertura declinada + chest press declinado + remada cotovelos altos","3×12 chest press miolo + flexão salto + remada em prancha","3×12 aberturas em pé + flexões cadeira + voos"],["Pernas e bíceps","3×12 agachamento + lunge trás + curl","3×12 sumô + lunge frente + martelo","3×12 peso morto + agachamento pernas juntas + concentrado","3×12 agachamento salto + lunge salto + martelo unilateral"],["Ombros e tríceps","3×12 abdução + press + francês","3×12 elevação + Arnold + testa","3×12 remada frontal + press unilateral + kickback","3×12 pike + burpee + flexão tríceps"]]},N={"Janeiro":["3 claras + 2 gemas; 2 fatias pão ou 20 g aveia + banana; chocolate negro","Skyr ou pudim proteico ou atum; banana; queijo fresco magro","150 g carne/peixe ou proteína vegetal; 100 g hidratos; 100 g legumes; salada","3 tostas arroz ou 2 fatias pão; skyr ou ovos ou atum; fruta","150 g carne/peixe ou proteína vegetal; 50 g hidratos; 100 g legumes; salada","Opcional: gelatina e fruta"],"Fevereiro":["200 g claras + ovo + vegetais; 30 g aveia + 30 g frutos vermelhos","150 g carne branca/peixe + 100 g hidratos + salada + 150 g legumes","Atum ou whey + pão ou banana; alternativa: claras, ovo, espinafres, aveia e frutos vermelhos","150 g carne branca/peixe + 50 g hidratos + salada + 150 g legumes; azeite ou abacate","2 ovos + gelatina"],"Março HIGH":["50 g aveia + canela + meia banana + frutos vermelhos; 2 ovos","75 g alimento proteico + 150 g hidratos + 125 g legumes; gelatina","Fruta + 2 fatias pão + ovo","Iogurte proteico ou atum + 2 tostas arroz + 20 g manteiga amendoim + 50 g frutos vermelhos ou ananás","75 g alimento proteico + 150 g hidratos + 125 g legumes; frutos vermelhos","2 tostas arroz + ovo"],"Março LOW":["150 ml claras + ovo + pimentos, espinafres e cogumelos","200 g alimento proteico + 50 g hidratos + 150 g legumes; gelatina","Fruta + 20 g frutos secos + 2 ovos","Iogurte proteico ou atum + queijo ou chocolate negro","200 g alimento proteico + 200 g legumes; frutos vermelhos","2 ovos ou iogurte proteico"]};let s;try{s=JSON.parse(localStorage.treino2)||{}}catch{s={}};s.m??='Janeiro';s.d??=0;s.n??='Janeiro';s.log??={};s.weight??={};let tab='Semana';const $=x=>document.getElementById(x),day=()=>new Date().toLocaleDateString('sv-SE'),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.treino2=JSON.stringify(s);function go(t){tab=t;render()}function set(k,v){s[k]=v;save();render()}function record(k,v){s.log[k]=v;save()}function opts(o,v){return Object.keys(o).map(k=>'<option '+(k===v?'selected':'')+'>'+k+'</option>').join('')}function card(t,i){let k=day()+'|'+s.m+'|'+s.d+'|'+i;return '<section><small>Bloco '+(i+1)+'</small><h3>'+esc(t)+'</h3><label><input type="checkbox" '+(s.log[k]?'checked':'')+' onchange="record(\''+k+'\',this.checked)">Concluído</label><input placeholder="Carga / repetições / notas" value="'+esc(s.log[k+'n']||'')+'" onchange="record(\''+k+'n\',this.value)"></section>'}function week(){const days=['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'];s.freq??=3;s.week??=0;const patterns={3:[0,2,4],4:[0,1,3,5],5:[0,1,2,4,5],6:[0,1,2,3,4,5]};const now=new Date();now.setHours(12,0,0,0);now.setDate(now.getDate()-((now.getDay()+6)%7)+7*s.week);const serial=Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-Date.UTC(2026,0,5))/604800000);const slots=patterns[s.freq];return '<section class="hero"><h2>A tua semana</h2><select onchange="set(\'m\',this.value)">'+opts(D,s.m)+'</select><label>Dias de treino por semana</label><select onchange="set(\'freq\',+this.value)">'+[3,4,5,6].map(n=>'<option value="'+n+'" '+(n===s.freq?'selected':'')+'>'+n+' dias</option>').join('')+'</select><div class="stats"><div class="stat"><small>Treinos</small><b>'+s.freq+'</b></div><div class="stat"><small>Recuperação</small><b>'+(7-s.freq)+'</b></div></div><p><button onclick="set(\'week\',s.week-1)">‹</button> '+now.toLocaleDateString('pt-PT')+' — '+new Date(now.getFullYear(),now.getMonth(),now.getDate()+6).toLocaleDateString('pt-PT')+' <button onclick="set(\'week\',s.week+1)">›</button></p><button onclick="set(\'week\',0)">Semana atual</button><p><small>'+(s.freq>3?'Frequência superior à base de 3 sessões. Reduz o volume por sessão e aumenta gradualmente; se houver fadiga, regressa a 3 dias.':'3 sessões com recuperação intercalada.')+'</small></p></section>'+days.map((d,i)=>{let pos=slots.indexOf(i),j=pos<0?-1:((serial*s.freq+pos)%3+3)%3;let date=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);return '<section class="weekcard '+(j<0?'rest':'')+'"><div class="dayicon">'+ico(j<0?'Semana':'Treino')+'</div><small>'+d+' · '+date.toLocaleDateString('pt-PT')+'</small><h3>'+(j<0?'Descanso / recuperação':D[s.m][j][0])+'</h3>'+(j<0?'<p>Descanso ou caminhada leve opcional.</p>':'<p>'+D[s.m][j].slice(1).map(esc).join('<br>')+'</p><button class="primary" onclick="set(\'d\','+j+');go(\'Treino\')">Abrir treino</button>')+'</section>'}).join('')}const icons={"Semana":"<rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"3\"/><path d=\"M7 3v4m10-4v4M3 10h18m-14 4h3m4 0h3m-10 3h3\"/>","Treino":"<path d=\"M6 6v12M3 9v6m15-9v12m3-9v6M6 12h12\"/>","Nutrição":"<path d=\"M5 3v8a3 3 0 0 0 6 0V3M8 3v18M19 3c-4 3-4 9 0 10v8\"/>","Progresso":"<path d=\"M3 3v18h18M7 16l5-5 4 3 5-7\"/>","Definições":"<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2\"/>"};function ico(t){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+icons[t]+'</svg>'}function theme(v){s.theme=v;save();document.documentElement.dataset.theme=v;render()}document.documentElement.dataset.theme=s.theme||'light';function settings(){return '<section><h2>Definições</h2><p>Personaliza a aparência da aplicação.</p><div class="settingrow"><b>Tema claro</b><button class="'+(s.theme!=='dark'?'themeon':'')+'" onclick="theme(\'light\')">Selecionar</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="settingrow"><b>Modo escuro</b><button class="'+(s.theme==='dark'?'themeon':'')+'" onclick="theme(\'dark\')">Selecionar</button></div></section><section><h3>Sobre</h3><p>Treino & Nutrição · v2.3</p><small>Registos guardados neste dispositivo.</small></section>'}function render(){let w=D[s.m][s.d];$('nav').innerHTML=['Semana','Treino','Nutrição','Progresso','Definições'].map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="go(\''+t+'\')">'+ico(t)+t+'</button>').join('');$('main').innerHTML=tab==='Definições'?settings():tab==='Semana'?week():tab==='Hoje'?'<section><small>'+day()+'</small><h2>'+w[0]+'</h2><p>'+s.m+' · Treino '+(s.d+1)+'</p><button class="primary" onclick="go(\'Treino\')">Começar treino</button></section><section><h2>Nutrição</h2><p>'+s.n+'</p><button onclick="go(\'Nutrição\')">Ver refeições</button></section><small>Escolhe o treino manualmente. Planos de referência, não personalizados.</small>':tab==='Treino'?'<section><h2>Plano de treino</h2><select onchange="set(\'m\',this.value)">'+opts(D,s.m)+'</select><select onchange="set(\'d\',+this.value)">'+D[s.m].map((x,i)=>'<option value="'+i+'" '+(i===s.d?'selected':'')+'>'+x[0]+'</option>').join('')+'</select><p>Descanso: 30 segundos após cada circuito.</p></section>'+card(s.m==='Janeiro'?'2×20 jumping jacks + 20 skipping alto':s.m==='Fevereiro'?'3×20 s flexões + agachamento salto + abdominal mola':'3×20 s lunge salto + burpee + mountain climbers',0)+w.slice(1).map((x,i)=>card(x,i+1)).join('')+card(s.m==='Janeiro'?'3×20 s crunch + lateral 20 s cada lado + prancha toque ombros 10 por lado':s.m==='Fevereiro'?'Abdominais 3×20 s — sequência visual pendente':'Abdominais 3×20 s superior, lateral e inferior (2 de cada)',8)+card(s.m==='Janeiro'?'15 min corrida, bicicleta ou corda':s.m==='Fevereiro'?'30 min corrida no fim':'40 min cardio',9):tab==='Nutrição'?'<section><h2>Plano alimentar</h2><select onchange="set(\'n\',this.value)">'+opts(N,s.n)+'</select><small>Quantidades de referência; peso cru/cozinhado não especificado.</small></section>'+N[s.n].map((x,i)=>'<section><h3>'+((s.n==='Janeiro'?['Pequeno-almoço','Lanche manhã','Almoço','Lanche tarde','Jantar','Ceia']:s.n==='Fevereiro'?['Lanche manhã','Almoço','Lanche tarde','Jantar','Ceia']:['Lanche manhã','Almoço','Lanche tarde 1','Lanche tarde 2','Jantar','Ceia'])[i])+'</h3><p>'+esc(x)+'</p></section>').join(''):'<section><h2>Peso corporal</h2><input id="kg" type="number" step=".1" placeholder="kg"><button onclick="if(+$(\'kg\').value>0){s.weight[day()]=+$(\'kg\').value;save();render()}">Guardar</button>'+Object.entries(s.weight).map(([k,v])=>'<p>'+esc(k)+' · '+esc(v)+' kg</p>').join('')+'</section><section><h2>Histórico</h2><p>'+Object.values(s.log).filter(v=>v===true).length+' blocos concluídos</p>'+Object.entries(s.log).filter(([k,v])=>k.endsWith('n')&&v).map(([k,v])=>'<p>'+esc(k)+' · '+esc(v)+'</p>').join('')+'</section>'}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></html>
