<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162d27"><link rel="manifest" href="manifest.json"><title>Treino & Nutrição</title><style>body{margin:0;background:#f3f5f3;color:#162d27;font:16px system-ui}main{max-width:520px;margin:40px auto;padding:24px}button,input{font:inherit;margin:12px 0}button{padding:12px;border:0;border-radius:12px;background:#21664d;color:white}iframe{border:0;width:100%;height:100dvh;display:block}#manage{position:fixed;right:8px;top:8px;z-index:5;font-size:12px;padding:8px;margin:0}</style><main id="setup"><h1>Treino & Nutrição</h1><p>Importa o ficheiro HTML pessoal da versão 1.1. O plano e as imagens ficam neste dispositivo, sem serem enviados ao GitHub.</p><input id="file" type="file" accept=".html,text/html"><p id="status"></p></main><button id="manage" hidden>Plano</button><iframe id="app" hidden title="Treino pessoal" style="display:none"></iframe><script>const q=id=>document.getElementById(id);let db;const req=indexedDB.open('treino-private',1);req.onupgradeneeded=()=>req.result.createObjectStore('plans');req.onsuccess=()=>{db=req.result;const r=db.transaction('plans').objectStore('plans').get('html');r.onsuccess=()=>{if(r.result)show(r.result)}};req.onerror=()=>q('status').textContent='Não foi possível abrir o armazenamento local.';function show(html){q('setup').hidden=true;q('manage').hidden=false;q('app').style.display='block';q('app').hidden=false;q('app').src=URL.createObjectURL(new Blob([html],{type:'text/html'}))}q('file').onchange=async()=>{try{const html=await q('file').files[0].text();if(!html.includes('Treino & Nutrição')||!html.includes('fit2022'))throw Error('Seleciona o HTML original da aplicação.');const t=db.transaction('plans','readwrite');t.objectStore('plans').put(html,'html');t.oncomplete=()=>show(html);t.onerror=()=>q('status').textContent='Erro ao guardar o plano.'}catch(e){q('status').textContent=e.message}};q('manage').onclick=()=>{q('app').style.display='none';q('setup').hidden=false;q('manage').hidden=true};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></html>
